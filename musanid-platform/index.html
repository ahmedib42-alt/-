<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة مُسانِد | المساعد الذكي لمعلم التربية الخاصة والتأهيل</title>
  
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Google Fonts: Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            tajawal: ['Tajawal', 'sans-serif'],
          },
          colors: {
            brand: {
              blue: '#1d4ed8',
              'blue-dark': '#1e3a8a',
              'blue-light': '#3b82f6',
              'blue-subtle': '#eff6ff',
              orange: '#ea580c',
              'orange-dark': '#c2410c',
              'orange-light': '#f97316',
              'orange-subtle': '#fff7ed',
            }
          }
        }
      }
    }
  </script>

  <!-- Modular Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 flex flex-col font-tajawal antialiased selection:bg-brand-blue selection:text-white">

  <!-- Root Mounting Point -->
  <div id="app"></div>

  <!-- Global Modal Container -->
  <div id="modal-container"></div>

  <!-- Global Floating Toast Notification -->
  <div id="toast-notification" class="flex items-center gap-3 bg-slate-900/95 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 backdrop-blur-md">
    <div id="toast-icon" class="w-8 h-8 rounded-xl bg-brand-orange text-white flex items-center justify-center font-bold">
      <i class="fa-solid fa-check"></i>
    </div>
    <div class="text-sm font-bold" id="toast-message">تمت العملية بنجاح</div>
  </div>

  <!-- Platform Modular Core Scripts (Loaded in Dependency Order) -->
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
